<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Maintenance — Admin System</title>
<!-- Library untuk Export Excel, PDF, dan Import CSV -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
:root{--bg:#f4f6fa;--panel:#fff;--border:#e5e9f0;--text:#1d2939;--muted:#667085;--navy:#13253f;--blue:#2463eb;--green:#087443;--amber:#935500;--red:#b42318;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{background:var(--navy);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{font-weight:800;font-size:16px}.brand small{display:block;font-weight:400;font-size:11px;color:#94a3b8}
.userbox{display:flex;align-items:center;gap:12px;font-size:13px}.userbox small{display:block;color:#94a3b8;font-size:11px}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:220px;background:var(--navy);color:#cbd5e1;padding:16px 0;flex-shrink:0}
.sidebar a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#cbd5e1;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
.sidebar a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar a.active{background:rgba(36,99,235,.2);color:#fff;border-left-color:var(--blue)}
.sidebar a span{width:18px;text-align:center}
.content{flex:1;padding:24px;overflow-x:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-size:22px;margin:4px 0;color:var(--navy)}h2{font-size:15px;color:var(--navy)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid-two{grid-template-columns:1fr}.sidebar{width:60px}.sidebar a{padding:12px;justify-content:center}.sidebar a span:last-child{display:none}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:0;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1d4fd8}
.btn-light{background:#eef2f7;color:var(--navy)}.btn-light:hover{background:#dde3ec}
.btn-success{background:var(--green);color:#fff}.btn-warning{background:#f5a623;color:#fff}.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #d0d5dd;border-radius:7px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:#475467;margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .span-2{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:1}}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc;font-weight:700}
tbody tr:hover{background:#f8fafc}.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.green{background:#e4f7ed;color:var(--green)}.badge.red{background:#feeceb;color:var(--red)}
.badge.amber{background:#fff2d5;color:var(--amber)}.badge.blue{background:#e8f1ff;color:#175cd3}.badge.gray{background:#f2f4f7;color:#667085}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:bold}
.alert.success{background:#e4f7ed;color:#087443;border:1px solid #a6e5c1}
.alert.error{background:#feeceb;color:#b42318;border:1px solid #f7b4b0}
.empty{padding:30px;text-align:center;color:var(--muted);font-style:italic}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:12px;align-items:center}
.metric-icon{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.metric-icon.blue{background:#e8f1ff;color:#175cd3}.metric-icon.amber{background:#fff2d5;color:#935500}
.metric-icon.red{background:#feeceb;color:#b42318}.metric-icon.purple{background:#f4ebff;color:#6941c6}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.metric-value{font-size:24px;font-weight:800;color:var(--navy)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#13253f,#2463eb)}
.login-card{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:40px;text-align:center;margin-bottom:8px}.login-card h1{text-align:center;font-size:20px;margin-bottom:4px}
.login-card p{text-align:center;color:var(--muted);font-size:12px;margin-bottom:24px}
.login-card .btn{width:100%;justify-content:center;margin-top:20px;padding:11px}
.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-bottom:10px}
/* CSS Khusus Print */
@media print {
  body { background: #fff; font-size: 12px; }
  .topbar, .sidebar, .btn, .no-print { display: none !important; }
  .content { padding: 0; }
  .layout { display: block; }
  .panel { border: none; box-shadow: none; padding: 0; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   1. KONFIGURASI FIREBASE
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBrgGfqLrEmNsOV64FWiPpBYt5tPx0ORDk",
  authDomain: "enginering-c421c.firebaseapp.com",
  databaseURL: "https://enginering-c421c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "enginering-c421c",
  storageBucket: "enginering-c421c.firebasestorage.app",
  messagingSenderId: "43147210096",
  appId: "1:43147210096:web:24fa84ef43cf9420ee33b5",
  measurementId: "G-GQ95ZBMVVV"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const FAKE_EMAIL_DOMAIN = "@app.local";

/* ============================================================
   2. STATE GLOBAL
   ============================================================ */
const S = {
  user: null, users: {}, departments: {}, items: {}, assets: {},
  requests: {}, workorders: {}, purchases: {}, logs: {}, settings: {},
  page: 'dashboard', editing: null
};

const ROLES = {
  ADMIN: 'Admin', WAREHOUSE: 'Gudang', REQUESTER: 'Pemohon',
  HEAD_DEPT: 'Kepala Departemen', ENG_SUPERVISOR: 'Supervisor Engineering',
  ENG_MANAGER: 'Kepala Engineering', DIRECTOR: 'Direktur'
};

/* ============================================================
   3. UTILITAS & RBAC
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => db.ref().push().key;
const now = () => Date.now();

function isAdmin() { return S.user && S.user.role === 'ADMIN'; }

function badge(s) {
  const map = {APPROVED:'green',COMPLETED:'green',REJECTED:'red',PENDING:'amber',REVISION:'amber',IN_PROGRESS:'blue',OPEN:'blue'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s||'').replace(/_/g,' ')}</span>`;
}
function flash(msg, type='success') {
  const el = document.createElement('div'); el.className = `alert ${type}`; el.textContent = msg;
  const main = $('.content') || $('#app'); main.prepend(el);
  setTimeout(() => el.remove(), 4000);
}

// UTILITY EXPORT & PRINT
function printTable(elementId, title) {
  const content = document.getElementById(elementId).outerHTML;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>${title}</title>
    <style>table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#f4f4f4}</style>
    </head><body><h2>${title}</h2>${content}<script>window.onload=()=>window.print()<\/script></body></html>`);
  win.document.close();
}
function exportExcel(tableId, filename) {
  const table = document.getElementById(tableId);
  const wb = XLSX.utils.table_to_book(table, {sheet:"Sheet1"});
  XLSX.writeFile(wb, filename + ".xlsx");
}
function exportPDF(elementId, filename) {
  const element = document.getElementById(elementId);
  html2pdf().from(element).set({ margin: 10, filename: filename + '.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).save();
}
function handleImportCSV(e, menuType) {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async function(results) {
      let count = 0;
      for (const row of results.data) {
        const id = uid();
        if (menuType === 'items' && row.item_name) {
          await db.ref('items/'+id).set({ item_code: row.item_code, item_name: row.item_name, unit: row.unit||'PCS', stock: parseInt(row.stock)||0 });
          count++;
        }
      }
      renderApp();
      flash(`Berhasil import ${count} data.`);
    }
  });
}

/* ============================================================
   4. AUTH & INIT
   ============================================================ */
auth.onAuthStateChanged(async user => {
  if (!user) { S.user = null; renderLogin(); return; }
  const snap = await db.ref('users/' + user.uid).once('value');
  const profile = snap.val();
  if (!profile) { auth.signOut(); return; }
  if (!profile.is_active) { await auth.signOut(); alert('Akun dinonaktifkan.'); return; }
  S.user = {uid: user.uid, ...profile};
  initDataListeners();
  renderApp();
});

function renderLogin() {
  $('#app').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <div class="login-logo">⚙</div><h1>Engineering Maintenance</h1><p>Work Order · Permintaan · Stok</p>
      <form id="loginForm">
        <label>Username</label><input type="text" name="username" required placeholder="cth: budi">
        <label>Password</label><input type="password" name="password" required>
        <button class="btn btn-primary" type="submit">Masuk</button>
      </form>
    </div></div>`;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try { await auth.signInWithEmailAndPassword(e.target.username.value.toLowerCase() + FAKE_EMAIL_DOMAIN, e.target.password.value); } 
    catch (err) { alert('Login gagal: Username atau Password salah.'); }
  });
}

/* ============================================================
   5. LAYOUT & ROUTING
   ============================================================ */
function initDataListeners() {
  db.ref('departments').on('value', s => { S.departments = s.val() || {}; if (S.user) renderApp(); });
  db.ref('items').on('value', s => { S.items = s.val() || {}; if (S.user) renderApp(); });
  db.ref('assets').on('value', s => { S.assets = s.val() || {}; if (S.user) renderApp(); });
  db.ref('requests').on('value', s => { S.requests = s.val() || {}; if (S.user) renderApp(); });
  db.ref('workorders').on('value', s => { S.workorders = s.val() || {}; if (S.user) renderApp(); });
  db.ref('purchases').on('value', s => { S.purchases = s.val() || {}; if (S.user) renderApp(); });
  db.ref('approval_logs').on('value', s => { S.logs = s.val() || {}; if (S.user) renderApp(); });
  db.ref('users').on('value', s => { S.users = s.val() || {}; if (S.user) renderApp(); });
  db.ref('settings').on('value', s => { S.settings = s.val() || {}; if (S.user) renderApp(); });
}

function renderApp() {
  if (!S.user) return;
  
  let navItems = [['dashboard','▦','Dashboard']];
  
  if (isAdmin()) {
    navItems.push(['items','▤','Master Barang']);
    navItems.push(['assets','⚙','Master Asset']);
    navItems.push(['requests','✚','Permintaan']);
    navItems.push(['approvals','✓','Approval']);
    navItems.push(['workorders','⚒','Work Order']);
    navItems.push(['purchases','🛒','Pembelian']);
    navItems.push(['departments','🏢','Departemen']);
    navItems.push(['users','⚿','Pengguna']);
    navItems.push(['settings','⚙','Profil Perusahaan']);
  } else {
    navItems.push(['requests','✚','Buat Permintaan']);
  }

  $('#app').innerHTML = `
    <header class="topbar no-print">
      <div class="brand">⚙ Engineering Maintenance<small>Admin System</small></div>
      <div class="userbox"><span>${esc(S.user.name)}<small>${esc(ROLES[S.user.role]||S.user.role)}</small></span><button class="btn btn-light btn-sm" onclick="auth.signOut()">Keluar</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar no-print">
        ${navItems.map(([k, ic, lbl]) => `<a class="${S.page===k?'active':''}" onclick="nav('${k}')"><span>${ic}</span><span>${lbl}</span></a>`).join('')}
      </aside>
      <main class="content" id="content"></main>
    </div>`;
  renderPage();
}

function nav(p) { S.page = p; S.editing = null; renderApp(); }

function renderPage() {
  const c = $('#content');
  const adminOnlyPages = ['items', 'assets', 'approvals', 'workorders', 'purchases', 'departments', 'users', 'settings'];
  if (adminOnlyPages.includes(S.page) && !isAdmin()) {
    c.innerHTML = `<div class="panel empty" style="color:var(--red); font-weight:bold; font-size:18px;">⛔ AKSES DITOLAK. Halaman ini hanya untuk Admin.</div>`;
    return;
  }

  if (S.page === 'dashboard') c.innerHTML = pageDashboard();
  else if (S.page === 'items') c.innerHTML = pageItems();
  else if (S.page === 'assets') c.innerHTML = pageAssets();
  else if (S.page === 'requests') c.innerHTML = pageRequests();
  else if (S.page === 'approvals') c.innerHTML = pageApprovals();
  else if (S.page === 'workorders') c.innerHTML = pageWorkOrders();
  else if (S.page === 'purchases') c.innerHTML = pagePurchases();
  else if (S.page === 'departments') c.innerHTML = pageDepartments();
  else if (S.page === 'users') c.innerHTML = pageUsers();
  else if (S.page === 'settings') c.innerHTML = pageSettings();
}

/* ============================================================
   6. PROFIL PERUSAHAAN
   ============================================================ */
function pageSettings() {
  const c = S.settings.company || {};
  return `
    <div class="page-head"><div><div class="eyebrow">PENGATURAN</div><h1>Profil Perusahaan</h1></div></div>
    <section class="panel">
      <form class="form-grid" onsubmit="saveCompany(event)">
        <label class="span-2">Nama Perusahaan<input id="comp_name" value="${esc(c.name||'')}" required></label>
        <label class="span-2">Alamat Lengkap<input id="comp_address" value="${esc(c.address||'')}" required></label>
        <label>Telepon<input id="comp_phone" value="${esc(c.phone||'')}"></label>
        <label>Website<input id="comp_web" value="${esc(c.web||'')}"></label>
        <div class="form-actions"><button class="btn btn-primary">Simpan Profil</button></div>
      </form>
    </section>`;
}
async function saveCompany(e) {
  e.preventDefault();
  await db.ref('settings/company').set({ name: $('#comp_name').value, address: $('#comp_address').value, phone: $('#comp_phone').value, web: $('#comp_web').value });
  renderApp(); flash('Data profil perusahaan berhasil disimpan.');
}

/* ============================================================
   7. MASTER BARANG
   ============================================================ */
function pageItems() {
  const rows = Object.entries(S.items);
  return `
    <div class="page-head"><div><div class="eyebrow">INVENTORY</div><h1>Master Barang</h1></div>
      <div class="action-row">
        <button class="btn btn-light" onclick="printTable('tbl-items', 'Master Barang')">🖨 Print</button>
        <button class="btn btn-light" onclick="exportExcel('tbl-items', 'Master_Barang')">📊 Excel</button>
        <button class="btn btn-light" onclick="exportPDF('panel-items', 'Master_Barang')">📄 PDF</button>
      </div>
    </div>
    <div class="grid-two">
      <section class="panel"><div class="panel-head"><h2>${S.editing ? 'Edit' : 'Tambah'} Barang</h2></div>
        <form class="form-grid" onsubmit="saveItem(event)">
          <input type="hidden" id="item_id" value="${S.editing||''}">
          <label>Kode<input id="item_code" required value="${esc(S.editing?S.items[S.editing].item_code:'')}"></label>
          <label>Nama Barang<input id="item_name" required value="${esc(S.editing?S.items[S.editing].item_name:'')}"></label>
          <label>Satuan<input id="item_unit" required value="${esc(S.editing?S.items[S.editing].unit:'PCS')}"></label>
          ${!S.editing ? '<label>Saldo Awal (Qty)<input type="number" id="item_stock" value="0" required></label>' : ''}
          <div class="form-actions">
            ${S.editing ? '<button type="button" class="btn btn-light" onclick="nav(\'items\')">Batal</button>' : ''}
            <button class="btn btn-primary">${S.editing ? 'Update Barang' : 'Simpan Barang'}</button>
          </div>
        </form>
      </section>
      <section class="panel"><div class="panel-head"><h2>Import CSV</h2></div>
        <p class="hint">Format: <code>item_code, item_name, unit, stock</code></p>
        <input type="file" accept=".csv" onchange="handleImportCSV(event, 'items')">
      </section>
    </div>
    <section class="panel" id="panel-items"><div class="table-wrap">
      <table id="tbl-items"><thead><tr><th>Kode</th><th>Nama</th><th>Satuan</th><th class="num">Stok</th><th>Aksi</th></tr></thead><tbody>
      ${rows.map(([id,i]) => `<tr>
        <td><strong>${esc(i.item_code)}</strong></td><td>${esc(i.item_name)}</td><td>${esc(i.unit)}</td><td class="num">${i.stock||0}</td>
        <td>
          <button class="btn btn-light btn-sm" onclick="editItem('${id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delItem('${id}')">Hapus</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="empty">Kosong.</td></tr>'}
    </tbody></table>
    </div></section>`;
}
async function saveItem(e) {
  e.preventDefault();
  const id = $('#item_id').value || uid();
  const data = { item_code: $('#item_code').value, item_name: $('#item_name').value, unit: $('#item_unit').value };
  if (!S.editing) data.stock = parseFloat($('#item_stock').value) || 0;
  await db.ref('items/' + id).update(data);
  nav('items'); // Menutup form edit dan me-refresh tabel
  flash('Data Barang berhasil disimpan.');
}
function editItem(id) { S.editing = id; renderApp(); }
async function delItem(id) { if(confirm('Hapus barang ini?')) { await db.ref('items/' + id).remove(); renderApp(); flash('Barang dihapus.'); } }

/* ============================================================
   8. MASTER ASET (DENGAN EDIT & SIMPAN)
   ============================================================ */
function pageAssets() {
  const rows = Object.entries(S.assets);
  const isEdit = S.page === 'assets' && S.editing;
  const a = isEdit ? S.assets[S.editing] : {asset_code:'', asset_name:''};
  
  return `
    <div class="page-head"><div><div class="eyebrow">MASTER DATA</div><h1>Master Asset</h1></div></div>
    <section class="panel"><div class="panel-head"><h2>${isEdit ? 'Edit' : 'Tambah'} Asset</h2></div>
      <form class="form-grid" onsubmit="saveAsset(event)">
        <input type="hidden" id="asset_id" value="${S.editing||''}">
        <label>Kode Asset<input id="asset_code" required value="${esc(a.asset_code)}"></label>
        <label>Nama Asset<input id="asset_name" required value="${esc(a.asset_name)}"></label>
        <div class="form-actions">
          ${isEdit ? '<button type="button" class="btn btn-light" onclick="nav(\'assets\')">Batal</button>' : ''}
          <button class="btn btn-primary">${isEdit ? 'Update Asset' : 'Simpan Asset'}</button>
        </div>
      </form>
    </section>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Aksi</th></tr></thead><tbody>
      ${rows.map(([id,a]) => `<tr>
        <td><strong>${esc(a.asset_code)}</strong></td><td>${esc(a.asset_name)}</td>
        <td>
          <button class="btn btn-light btn-sm" onclick="editAsset('${id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delAsset('${id}')">Hapus</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="3" class="empty">Kosong.</td></tr>'}
    </tbody></table></div></section>`;
}

async function saveAsset(e) {
  e.preventDefault();
  const id = $('#asset_id').value || uid();
  await db.ref('assets/' + id).update({ asset_code: $('#asset_code').value, asset_name: $('#asset_name').value });
  nav('assets'); // Menutup form edit dan me-refresh tabel
  flash('Data Asset berhasil disimpan.');
}
function editAsset(id) { S.editing = id; renderApp(); }
async function delAsset(id) { if(confirm('Hapus asset ini?')) { await db.ref('assets/' + id).remove(); renderApp(); flash('Asset dihapus.'); } }

/* ============================================================
   9. MASTER DEPARTEMEN (DENGAN EDIT & SIMPAN)
   ============================================================ */
function pageDepartments() {
  const rows = Object.entries(S.departments);
  const isEdit = S.page === 'departments' && S.editing;
  const d = isEdit ? S.departments[S.editing] : {code:'', name:''};

  return `
    <div class="page-head"><div><div class="eyebrow">MASTER DATA</div><h1>Master Departemen</h1></div></div>
    <section class="panel"><div class="panel-head"><h2>${isEdit ? 'Edit' : 'Tambah'} Departemen</h2></div>
      <form class="form-grid" onsubmit="saveDept(event)">
        <input type="hidden" id="dept_id" value="${S.editing||''}">
        <label>Kode<input id="dept_code" required placeholder="ENG" value="${esc(d.code)}"></label>
        <label>Nama Departemen<input id="dept_name" required placeholder="Engineering" value="${esc(d.name)}"></label>
        <div class="form-actions">
          ${isEdit ? '<button type="button" class="btn btn-light" onclick="nav(\'departments\')">Batal</button>' : ''}

      </form>
    </section>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Aksi</th></tr></thead><tbody>
      ${rows.map(([id,dept]) => `<tr>
        <td><strong>${esc(dept.code)}</strong></td><td>${esc(dept.name)}</td>
        <td>
          <button class="btn btn-light btn-sm" onclick="editDept('${id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delDept('${id}')">Hapus</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="3" class="empty">Kosong.</td></tr>'}
    </tbody></table></div></section>`;
}

async function saveDept(e) {
  e.preventDefault();
  const id = $('#dept_id').value || uid();
  await db.ref('departments/' + id).update({ code: $('#dept_code').value.toUpperCase(), name: $('#dept_name').value });
  nav('departments'); // Menutup form edit dan me-refresh tabel
  flash('Data Departemen berhasil disimpan.');
}
function editDept(id) { S.editing = id; renderApp(); }
async function delDept(id) { if(confirm('Hapus departemen ini?')) { await db.ref('departments/' + id).remove(); renderApp(); flash('Departemen dihapus.'); } }

/* ============================================================
   10. WORK ORDER & PEMBELIAN
   ============================================================ */
function pageWorkOrders() {
  const rows = Object.entries(S.workorders).sort((a,b) => (b[1].created_at||0) - (a[1].created_at||0));
  return `<div class="page-head"><div><div class="eyebrow">ENGINEERING</div><h1>Work Order (SPK)</h1></div></div>
  ${rows.map(([id, wo]) => {
    const req = S.requests[wo.request_id] || {};
    return `<section class="panel">
      <div class="panel-head no-print"><div><h2>${esc(wo.wo_no)}</h2></div>
        <div class="action-row">${badge(wo.status)} <button class="btn btn-light btn-sm" onclick="printSPK('${id}')">🖨 Cetak SPK</button></div>
      </div>
      <div id="print-spk-${id}" style="display:none;">
        <div style="text-align:center; border-bottom:3px double #000; padding-bottom:10px; margin-bottom:20px;">
          <h1 style="margin:0;font-size:24px;">${esc(S.settings.company?.name || 'NAMA PERUSAHAAN')}</h1>
          <p style="margin:5px 0;">${esc(S.settings.company?.address || 'Alamat Perusahaan')}</p>
          <p style="margin:0;">Telp: ${esc(S.settings.company?.phone || '-')} | Web: ${esc(S.settings.company?.web || '-')}</p>
        </div>
        <h3 style="text-align:center; text-decoration:underline;">SURAT PERINTAH KERJA (SPK)</h3>
        <p style="text-align:right;">No: <strong>${esc(wo.wo_no)}</strong></p>
        <table style="width:100%; margin-bottom:15px; border:none;">
          <tr><td style="width:20%;border:none;">No. Permintaan</td><td style="border:none;">: ${esc(req.request_no||'—')}</td></tr>
          <tr><td style="border:none;">Pemohon</td><td style="border:none;">: ${esc(req.requester_name||'—')}</td></tr>
          <tr><td style="border:none;">Deskripsi</td><td style="border:none;">: ${esc(req.description||'—')}</td></tr>
        </table>
        <table border="1" cellpadding="8" style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          <tr><th style="background:#f4f4f4; width:30%;">Diagnosa</th><td>${esc(wo.diagnosis||'—')}</td></tr>
          <tr><th style="background:#f4f4f4;">Tindakan</th><td>${esc(wo.action_taken||'—')}</td></tr>
        </table>
        <div style="display:flex; justify-content:space-between; margin-top:40px;">
          <div style="text-align:center;">Pemohon<br><br><br><br>(_________________)</div>
          <div style="text-align:center;">Teknisi<br><br><br><br>(_________________)</div>
          <div style="text-align:center;">Kepala Engineering<br><br><br><br>(_________________)</div>
        </div>
      </div>
      <div class="no-print">
        <p>${esc(req.description||'')}</p>
        <form class="form-grid" onsubmit="saveWO(event,'${id}')" style="margin-top:12px">
          <label>Status<select id="wo_status_${id}">${['OPEN','IN_PROGRESS','COMPLETED'].map(s => `<option value="${s}" ${wo.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
          <label>Diagnosa<textarea id="wo_diag_${id}">${esc(wo.diagnosis||'')}</textarea></label>
          <label>Tindakan<textarea id="wo_act_${id}">${esc(wo.action_taken||'')}</textarea></label>
          <div class="form-actions"><button class="btn btn-primary">Simpan</button></div>
        </form>
        <div style="margin-top:15px; background:#fff3d8; padding:10px; border-radius:8px;">
          <h4 style="margin-bottom:5px;font-size:12px;">Barang tidak ada di gudang? Ajukan Pembelian:</h4>
          <form style="display:flex;gap:10px;" onsubmit="requestPurchase(event,'${id}')">
            <input type="text" id="pur_item_${id}" placeholder="Nama Barang" required style="flex:1;">
            <input type="number" id="pur_qty_${id}" placeholder="Qty" required style="width:80px;">
            <button class="btn btn-warning btn-sm">Ajukan</button>
          </form>
        </div>
      </div>
    </section>`;
  }).join('') || '<div class="panel empty">Belum ada Work Order.</div>'}`;
}
function printSPK(id) {
  const content = document.getElementById('print-spk-' + id).innerHTML;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Cetak SPK</title><style>body{font-family:Arial,sans-serif;font-size:14px;padding:20px;}</style></head><body>${content}<script>window.onload=()=>window.print()<\/script></body></html>`);
  win.document.close();
}
async function saveWO(e, id) {
  e.preventDefault();
  const status = $('#wo_status_'+id).value;
  await db.ref('workorders/' + id).update({ status, diagnosis: $('#wo_diag_'+id).value, action_taken: $('#wo_act_'+id).value, updated_at: now() });
  flash('Data Work Order berhasil disimpan.'); renderApp();
}
async function requestPurchase(e, woId) {
  e.preventDefault();
  await db.ref('purchases/' + uid()).set({ wo_id: woId, item_name: $('#pur_item_'+woId).value, qty: $('#pur_qty_'+woId).value, status: 'PENDING', requester_name: S.user.name, created_at: now() });
  flash('Pengajuan pembelian berhasil dikirim.'); renderApp();
}
function pagePurchases() {
  const rows = Object.entries(S.purchases);
  return `<div class="page-head"><div><div class="eyebrow">PROCUREMENT</div><h1>Permintaan Pembelian</h1></div></div>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Qty</th><th>Status</th></tr></thead><tbody>
    ${rows.map(([id,p]) => `<tr><td>${new Date(p.created_at).toLocaleDateString()}</td><td>${esc(p.item_name)}</td><td>${p.qty}</td><td>${badge(p.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Belum ada pembelian.</td></tr>'}
  </tbody></table></div></section>`;
}

/* ============================================================
   11. MANAJEMEN USER & APPROVAL
   ============================================================ */
function pageUsers() {
  const rows = Object.entries(S.users);
  return `<div class="page-head"><div><div class="eyebrow">ADMIN</div><h1>Pengguna</h1></div></div>
  
  <div class="grid-two">
    <section class="panel"><div class="panel-head"><h2>Buat Akun Baru</h2></div>
      <form class="form-grid" onsubmit="createNewUser(event)">
        <label>Nama Lengkap<input id="new_name" required></label>
        <label>Username<input id="new_username" required></label>
        <label>Password<input type="password" id="new_password" required minlength="6"></label>
        <label>Role<select id="new_role">
          <option value="REQUESTER">Pemohon</option>
          <option value="HEAD_DEPT">Kepala Departemen</option>
          <option value="WAREHOUSE">Gudang</option>
          <option value="ENG_SUPERVISOR">Supervisor Engineering</option>
          <option value="ENG_MANAGER">Kepala Engineering</option>
          <option value="DIRECTOR">Direktur</option>
          <option value="ADMIN">Admin</option>
        </select></label>
        <label>Departemen<select id="new_dept">
          <option value="">— Tidak ada —</option>
          ${Object.entries(S.departments).map(([id,d]) => `<option value="${id}">${esc(d.name)}</option>`).join('')}
        </select></label>
        <div class="form-actions"><button class="btn btn-primary">Buat Akun</button></div>
      </form>
    </section>

    <section class="panel" id="editUserPanel" style="display:none; background:#f0f5ff; border-color:#c3d7ff;">
      <div class="panel-head"><h2>Edit Akses Pengguna</h2></div>
      <form class="form-grid" onsubmit="updateUser(event)">
        <input type="hidden" id="edit_uid">
        <label>Username<input id="edit_username" disabled></label>
        <label>Nama Lengkap<input id="edit_name" required></label>
        <label>Role<select id="edit_role">
          <option value="REQUESTER">Pemohon</option>
          <option value="HEAD_DEPT">Kepala Departemen</option>
          <option value="WAREHOUSE">Gudang</option>
          <option value="ENG_SUPERVISOR">Supervisor Engineering</option>
          <option value="ENG_MANAGER">Kepala Engineering</option>
          <option value="DIRECTOR">Direktur</option>
          <option value="ADMIN">Admin</option>
        </select></label>
        <label>Departemen<select id="edit_dept">
          <option value="">— Tidak ada —</option>
          ${Object.entries(S.departments).map(([id,d]) => `<option value="${id}">${esc(d.name)}</option>`).join('')}
        </select></label>
        <div class="form-actions">
          <button type="button" class="btn btn-light" onclick="document.getElementById('editUserPanel').style.display='none'">Batal</button>
          <button class="btn btn-primary">Simpan Perubahan</button>
        </div>
      </form>
    </section>
  </div>

  <section class="panel"><div class="panel-head"><h2>Daftar Pengguna</h2></div>
    <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Departemen</th><th>Aksi</th></tr></thead><tbody>
    ${rows.map(([uid, u]) => `<tr>
      <td>${esc(u.name)}</td><td><strong>${esc(u.username)}</strong></td>
      <td><span class="badge blue">${ROLES[u.role]||u.role}</span></td>
      <td>${u.department_id ? esc((S.departments[u.department_id]||{}).name||'—') : '—'}</td>
      <td>
        <button class="btn btn-light btn-sm" onclick="editUser('${uid}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteUser('${uid}')">Hapus</button>
      </td>
    </tr>`).join('')}
  </tbody></table></div></section>`;
}

async function createNewUser(e) {
  e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true;
  const uname = $('#new_username').value.toLowerCase();
  try {
    const secApp = firebase.initializeApp(firebaseConfig, "Sec");
    const cred = await secApp.auth().createUserWithEmailAndPassword(uname + FAKE_EMAIL_DOMAIN, $('#new_password').value);
    await db.ref('users/' + cred.user.uid).set({ 
      name: $('#new_name').value, username: uname, role: $('#new_role').value, 
      department_id: $('#new_dept').value || null, is_active: true 
    });
    await secApp.auth().signOut(); await secApp.delete();
    flash('Akun pengguna berhasil dibuat.'); e.target.reset();
  } catch (err) { flash(err.message, 'error'); }
  btn.disabled = false;
}

function editUser(uid) {
  const u = S.users[uid];
  $('#edit_uid').value = uid;
  $('#edit_username').value = u.username;
  $('#edit_name').value = u.name;
  $('#edit_role').value = u.role;
  $('#edit_dept').value = u.department_id || '';
  $('#editUserPanel').style.display = 'block';
  window.scrollTo(0, 0);
}

async function updateUser(e) {
  e.preventDefault();
  const id = $('#edit_uid').value;
  await db.ref('users/' + id).update({
    name: $('#edit_name').value,
    role: $('#edit_role').value,
    department_id: $('#edit_dept').value || null
  });
  $('#editUserPanel').style.display = 'none';
  renderApp(); flash('Data pengguna berhasil diperbarui.');
}

async function deleteUser(uid) {
  if (uid === S.user.uid) return alert('Anda tidak bisa menghapus akun Anda sendiri.');
  if (!confirm('Hapus pengguna ini? Pengguna tidak akan bisa login lagi.')) return;
  await db.ref('users/' + uid).remove();
  renderApp(); flash('Pengguna berhasil dihapus (Akses dicabut).');
}

function pageApprovals() {
  const pending = Object.entries(S.logs).filter(([id,l]) => l.decision === 'PENDING');
  return `<div class="page-head"><div><div class="eyebrow">WORKFLOW</div><h1>Approval</h1></div></div>
  ${pending.map(([logId, log]) => {
    const r = S.requests[log.request_id] || {};
    return `<section class="panel"><h2>${esc(r.request_no)}</h2><p>${esc(r.description)}</p>
      <div style="margin-top:10px;">
        <button class="btn btn-success btn-sm" onclick="decideApproval('${logId}','APPROVED')">Setujui</button>
        <button class="btn btn-danger btn-sm" onclick="decideApproval('${logId}','REJECTED')">Tolak</button>
      </div>
    </section>`;
  }).join('') || '<div class="panel empty">Tidak ada approval.</div>'}`;
}
async function decideApproval(logId, dec) {
  const log = S.logs[logId];
  await db.ref('approval_logs/' + logId).update({ decision: dec, decided_at: now() });
  await db.ref('requests/' + log.request_id).update({status: dec});
  if (dec === 'APPROVED') await db.ref('workorders/' + uid()).set({ wo_no: 'WO-'+Date.now().toString().slice(-6), request_id: log.request_id, status: 'OPEN', created_at: now() });
  renderApp(); flash('Keputusan approval berhasil disimpan.');
}

function pageDashboard() {
  return `<div class="page-head"><div><h1>Dashboard</h1></div></div>
  <div class="metrics">
    <div class="metric"><div class="metric-icon blue">▤</div><div><div class="metric-label">Total Permintaan</div><div class="metric-value">${Object.keys(S.requests).length}</div></div></div>
    <div class="metric"><div class="metric-icon purple">⚒</div><div><div class="metric-label">Work Order</div><div class="metric-value">${Object.keys(S.workorders).length}</div></div></div>
  </div>`;
}

function pageRequests() {
  const rows = Object.entries(S.requests);
  return `
    <div class="page-head"><div><div class="eyebrow">MAINTENANCE</div><h1>Permintaan</h1></div></div>
    <section class="panel"><form class="form-grid" onsubmit="saveRequest(event)">
      <label class="span-2">Deskripsi Kerusakan<textarea id="req_desc" required></textarea></label>
      <div class="form-actions"><button class="btn btn-primary">Kirim Permintaan</button></div>
    </form></section>
    <section class="panel"><table><thead><tr><th>No</th><th>Deskripsi</th><th>Status</th></tr></thead><tbody>
      ${rows.map(([id,r]) => `<tr><td>${esc(r.request_no)}</td><td>${esc(r.description)}</td><td>${badge(r.status)}</td></tr>`).join('')}
    </tbody></table></section>`;
}
async function saveRequest(e) {
  e.preventDefault();
  await db.ref('requests/' + uid()).set({ request_no: 'PR-'+Date.now().toString().slice(-6), description: $('#req_desc').value, requester_name: S.user.name, status: 'PENDING', created_at: now() });
  renderApp(); flash('Permintaan berhasil dibuat.');
}
</script>
</body>
