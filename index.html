<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Maintenance — Firebase</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--border:#e5e9f0;--text:#1d2939;--muted:#667085;--navy:#13253f;--blue:#2463eb;--green:#087443;--amber:#935500;--red:#b42318;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{background:var(--navy);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{font-weight:800;font-size:16px}.brand small{display:block;font-weight:400;font-size:11px;color:#94a3b8}
.userbox{display:flex;align-items:center;gap:12px;font-size:13px}.userbox small{display:block;color:#94a3b8;font-size:11px}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:220px;background:var(--navy);color:#cbd5e1;padding:16px 0;flex-shrink:0}
.sidebar a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#cbd5e1;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
.sidebar a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar a.active{background:rgba(36,99,235,.2);color:#fff;border-left-color:var(--blue)}
.sidebar a span{width:18px;text-align:center}
.content{flex:1;padding:24px;overflow-x:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-size:22px;margin:4px 0;color:var(--navy)}h2{font-size:15px;color:var(--navy)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid-two{grid-template-columns:1fr}.sidebar{width:60px}.sidebar a{padding:12px;justify-content:center}.sidebar a span:last-child{display:none}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:0;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1d4fd8}
.btn-light{background:#eef2f7;color:var(--navy)}.btn-light:hover{background:#dde3ec}
.btn-success{background:var(--green);color:#fff}.btn-warning{background:#f5a623;color:#fff}.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #d0d5dd;border-radius:7px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:#475467;margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .span-2{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:1}}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc;font-weight:700}
tbody tr:hover{background:#f8fafc}.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.green{background:#e4f7ed;color:var(--green)}.badge.red{background:#feeceb;color:var(--red)}
.badge.amber{background:#fff2d5;color:var(--amber)}.badge.blue{background:#e8f1ff;color:#175cd3}.badge.gray{background:#f2f4f7;color:#667085}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
.alert.success{background:#e4f7ed;color:#087443;border:1px solid #a6e5c1}
.alert.error{background:#feeceb;color:#b42318;border:1px solid #f7b4b0}
.empty{padding:30px;text-align:center;color:var(--muted);font-style:italic}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:12px;align-items:center}
.metric-icon{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.metric-icon.blue{background:#e8f1ff;color:#175cd3}.metric-icon.amber{background:#fff2d5;color:#935500}
.metric-icon.red{background:#feeceb;color:#b42318}.metric-icon.purple{background:#f4ebff;color:#6941c6}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.metric-value{font-size:24px;font-weight:800;color:var(--navy)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#13253f,#2463eb)}
.login-card{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:40px;text-align:center;margin-bottom:8px}.login-card h1{text-align:center;font-size:20px;margin-bottom:4px}
.login-card p{text-align:center;color:var(--muted);font-size:12px;margin-bottom:24px}
.login-card .btn{width:100%;justify-content:center;margin-top:20px;padding:11px}
.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase SDK v9 Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   1. KONFIGURASI FIREBASE (SESUAIKAN API KEY & APP ID)
   ============================================================ */
const firebaseConfig = {
  // GANTI DENGAN API KEY ASLI DARI FIREBASE CONSOLE
  apiKey: "AIzaSyBrgGfqLrEmNsOV64FWiPpBYt5tPx0ORDk", 
  authDomain: "engineering-c421c.firebaseapp.com",
  databaseURL: "https://engineering-c421c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "engineering-c421c",
  storageBucket: "engineering-c421c.appspot.com",
  // GANTI DENGAN SENDER ID ASLI
  messagingSenderId: "1234567890", 
  // GANTI DENGAN APP ID ASLI
  appId: "1:12345:web:abcde" 
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ============================================================
   2. STATE GLOBAL
   ============================================================ */
const S = {
  user: null, users: {}, departments: {}, items: {}, assets: {},
  requests: {}, workorders: {}, stocks: {}, purchases: {}, logs: {},
  page: 'dashboard', editing: null
};

const ROLES = {
  ADMIN: 'Admin', WAREHOUSE: 'Gudang', REQUESTER: 'Pemohon',
  HEAD_DEPT: 'Kepala Departemen', ENG_SUPERVISOR: 'Supervisor Engineering',
  ENG_MANAGER: 'Kepala Engineering', DIRECTOR: 'Direktur', AUDITOR: 'Auditor'
};

/* ============================================================
   3. UTILITAS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => db.ref().push().key;
const now = () => Date.now();
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtNum = n => Number(n||0).toLocaleString('id-ID', {maximumFractionDigits:3});

function badge(s) {
  const map = {APPROVED:'green',COMPLETED:'green',REJECTED:'red',CANCELLED:'red',PENDING:'amber',REVISION:'amber',WAITING_PARTS:'amber',IN_PROGRESS:'blue',OPEN:'blue',PROGRESS:'blue'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s||'').replace(/_/g,' ')}</span>`;
}
function flash(msg, type='success') {
  const el = document.createElement('div'); el.className = `alert ${type}`; el.textContent = msg;
  const main = $('.content') || $('#app'); main.prepend(el);
  setTimeout(() => el.remove(), 4000);
}
function hasRole(...roles) { return S.user && (roles.includes(S.user.role) || S.user.role === 'ADMIN'); }
function stageLabel(s) { return {HEAD_DEPARTMENT:'Kepala Dept', ENGINEERING_SUPERVISOR:'Spv Eng', ENGINEERING_MANAGER:'Kepala Eng', DIRECTOR:'Direktur'}[s] || s; }
function totalStock(itemId) { return Object.values(S.stocks).filter(s => s.item_id === itemId).reduce((a,s) => a + Number(s.qty||0), 0); }

/* ============================================================
   4. AUTH & INIT
   ============================================================ */
auth.onAuthStateChanged(async user => {
  if (!user) { S.user = null; renderLogin(); return; }
  const snap = await db.ref('users/' + user.uid).once('value');
  const profile = snap.val();
  
  if (!profile) {
    const newProfile = {name: user.email.split('@')[0], email: user.email, role: 'REQUESTER', department_id: null, is_active: true, created_at: now()};
    await db.ref('users/' + user.uid).set(newProfile);
    S.user = {uid: user.uid, ...newProfile};
  } else {
    if (!profile.is_active) { await auth.signOut(); alert('Akun dinonaktifkan.'); return; }
    S.user = {uid: user.uid, ...profile};
  }
  initDataListeners();
  renderApp();
});

function initDataListeners() {
  db.ref('departments').on('value', s => { S.departments = s.val() || {}; if (S.user) renderApp(); });
  db.ref('items').on('value', s => { S.items = s.val() || {}; if (S.user) renderApp(); });
  db.ref('assets').on('value', s => { S.assets = s.val() || {}; if (S.user) renderApp(); });
  db.ref('requests').on('value', s => { S.requests = s.val() || {}; if (S.user) renderApp(); });
  db.ref('workorders').on('value', s => { S.workorders = s.val() || {}; if (S.user) renderApp(); });
  db.ref('stock_balances').on('value', s => { S.stocks = s.val() || {}; if (S.user) renderApp(); });
  db.ref('purchases').on('value', s => { S.purchases = s.val() || {}; if (S.user) renderApp(); });
  db.ref('approval_logs').on('value', s => { S.logs = s.val() || {}; if (S.user) renderApp(); });
  db.ref('users').on('value', s => { S.users = s.val() || {}; if (S.user) renderApp(); });
}

// Seed Departemen Awal jika kosong
db.ref('departments').once('value').then(snap => {
  if (!snap.exists()) {
    db.ref('departments').set({
      'D1': {code:'ENG', name:'Engineering'}, 'D2': {code:'PROD', name:'Produksi'}, 'D3': {code:'WH', name:'Gudang'}
    });
  }
});

/* ============================================================
   5. LAYOUT & ROUTING
   ============================================================ */
function renderLogin() {
  $('#app').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <div class="login-logo">⚙</div><h1>Engineering Maintenance</h1><p>Work Order · Permintaan · Stok</p>
      <form id="loginForm">
        <label>Email</label><input type="email" name="email" required autocomplete="username">
        <label>Password</label><input type="password" name="password" required minlength="6" autocomplete="current-password">
        <button class="btn btn-primary" type="submit">Masuk</button>
      </form>
      <p class="muted" style="margin-top:16px;text-align:center;font-size:11px">Belum punya akun? <a href="#" id="showRegister" style="color:var(--blue)">Daftar</a></p>
    </div></div>`;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try { await auth.signInWithEmailAndPassword(e.target.email.value, e.target.password.value); } 
    catch (err) { alert('Login gagal: ' + err.message); }
  });
  $('#showRegister').addEventListener('click', async e => {
    e.preventDefault();
    const email = prompt('Email:'); const pw = prompt('Password (min 6):'); const name = prompt('Nama lengkap:');
    if (!email || !pw || !name) return;
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      await db.ref('users/' + cred.user.uid).set({ name, email, role: 'REQUESTER', department_id: null, is_active: true, created_at: now() });
    } catch (err) { alert('Registrasi gagal: ' + err.message); }
  });
}

function renderApp() {
  if (!S.user) return;
  const navItems = [
    ['dashboard','▦','Dashboard'], ['items','▤','Master Barang'], ['assets','⚙','Master Asset'],
    ['requests','✚','Permintaan'], ['approvals','✓','Approval'], ['workorders','⚒','Work Order'],
    ['purchases','🛒','Pembelian'], ['stockcard','▥','Kartu Stok'], ['users','⚿','Pengguna']
  ];
  $('#app').innerHTML = `
    <header class="topbar">
      <div class="brand">⚙ Engineering Maintenance<small>Firebase Connected</small></div>
      <div class="userbox"><span>${esc(S.user.name)}<small>${esc(ROLES[S.user.role]||S.user.role)}</small></span><button class="btn btn-light btn-sm" onclick="auth.signOut()">Keluar</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        ${navItems.map(([k, ic, lbl]) => `<a class="${S.page===k?'active':''}" onclick="nav('${k}')"><span>${ic}</span><span>${lbl}</span></a>`).join('')}
      </aside>
      <main class="content" id="content"></main>
    </div>`;
  renderPage();
}

function nav(p) { S.page = p; S.editing = null; renderApp(); }

function renderPage() {
  const c = $('#content');
  if (S.page === 'dashboard') c.innerHTML = pageDashboard();
  else if (S.page === 'items') c.innerHTML = pageItems();
  else if (S.page === 'assets') c.innerHTML = pageAssets();
  else if (S.page === 'requests') c.innerHTML = pageRequests();
  else if (S.page === 'approvals') c.innerHTML = pageApprovals();
  else if (S.page === 'workorders') c.innerHTML = pageWorkOrders();
  else if (S.page === 'purchases') c.innerHTML = pagePurchases();
  else if (S.page === 'stockcard') c.innerHTML = pageStockCard();
  else if (S.page === 'users') c.innerHTML = pageUsers();
}

/* ============================================================
   6. DASHBOARD
   ============================================================ */
function pageDashboard() {
  const reqCount = Object.keys(S.requests).length;
  const pending = Object.values(S.logs).filter(l => l.decision === 'PENDING').length;
  const activeWo = Object.values(S.workorders).filter(w => ['OPEN','IN_PROGRESS','WAITING_PARTS'].includes(w.status)).length;
  const lowStock = Object.values(S.items).filter(i => totalStock(Object.keys(S.items).find(k=>S.items[k]===i)) <= (i.min_stock||0)).length;
  
  return `
    <div class="page-head"><div><div class="eyebrow">OVERVIEW</div><h1>Dashboard</h1></div></div>
    <div class="metrics">
      <div class="metric"><div class="metric-icon blue">▤</div><div><div class="metric-label">Total Permintaan</div><div class="metric-value">${reqCount}</div></div></div>
      <div class="metric"><div class="metric-icon amber">✓</div><div><div class="metric-label">Approval Pending</div><div class="metric-value">${pending}</div></div></div>
      <div class="metric"><div class="metric-icon purple">⚒</div><div><div class="metric-label">WO Aktif</div><div class="metric-value">${activeWo}</div></div></div>
      <div class="metric"><div class="metric-icon red">!</div><div><div class="metric-label">Stok Kritis</div><div class="metric-value">${lowStock}</div></div></div>
    </div>
    <div class="grid-two">
      <section class="panel"><div class="panel-head"><h2>Permintaan Terbaru</h2></div>
        <div class="table-wrap"><table><thead><tr><th>No.</th><th>Aset</th><th>Status</th></tr></thead><tbody>
        ${Object.entries(S.requests).sort((a,b) => (b[1].created_at||0) - (a[1].created_at||0)).slice(0,5).map(([id,r]) => `<tr><td><strong>${esc(r.request_no)}</strong></td><td>${esc((S.assets[r.asset_id]||{}).asset_name||'—')}</td><td>${badge(r.status)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Belum ada.</td></tr>'}
        </tbody></table></div>
      </section>
      <section class="panel"><div class="panel-head"><h2>Stok Menipis</h2></div>
        <div class="table-wrap"><table><thead><tr><th>Barang</th><th class="num">Saldo</th></tr></thead><tbody>
        ${Object.entries(S.items).filter(([id,i]) => totalStock(id) <= (i.min_stock||0)).slice(0,5).map(([id,i]) => `<tr><td><strong>${esc(i.item_code)}</strong><br>${esc(i.item_name)}</td><td class="num" style="color:var(--red)">${fmtNum(totalStock(id))} ${esc(i.unit)}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">Stok aman.</td></tr>'}
        </tbody></table></div>
      </section>
    </div>`;
}

/* ============================================================
   7. MASTER BARANG (ITEMS)
   ============================================================ */
function pageItems() {
  const canManage = hasRole('WAREHOUSE');
  const rows = Object.entries(S.items).sort((a,b) => (a[1].item_name||'').localeCompare(b[1].item_name||''));
  return `
    <div class="page-head"><div><div class="eyebrow">INVENTORY</div><h1>Master Barang</h1></div></div>
    ${canManage ? `<section class="panel"><div class="panel-head"><h2>Tambah Barang</h2></div>
      <form class="form-grid" onsubmit="saveItem(event)">
        <label>Kode<input id="item_code" required></label><label>Nama<input id="item_name" required></label>
        <label>Satuan<input id="item_unit" required placeholder="PCS"></label><label>Min. Stok<input id="item_min" type="number" value="0" required></label>
        <div class="form-actions"><button class="btn btn-primary">Simpan</button></div>
      </form></section>` : ''}
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Satuan</th><th class="num">Saldo</th><th>Status</th></tr></thead><tbody>
      ${rows.map(([id,i]) => `<tr><td><strong>${esc(i.item_code)}</strong></td><td>${esc(i.item_name)}</td><td>${esc(i.unit)}</td><td class="num">${fmtNum(totalStock(id))}</td><td>${totalStock(id) <= (i.min_stock||0) ? '<span class="badge red">Kritis</span>' : '<span class="badge green">Aman</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Belum ada barang.</td></tr>'}
    </tbody></table></div></section>`;
}
async function saveItem(e) {
  e.preventDefault();
  await db.ref('items/' + uid()).set({ item_code: $('#item_code').value, item_name: $('#item_name').value, unit: $('#item_unit').value, min_stock: parseFloat($('#item_min').value), is_active: true });
  flash('Barang tersimpan.'); renderApp();
}

/* ============================================================
   8. MASTER ASSET
   ============================================================ */
function pageAssets() {
  const canManage = hasRole('WAREHOUSE','ENG_SUPERVISOR');
  const rows = Object.entries(S.assets).sort((a,b) => (a[1].asset_name||'').localeCompare(b[1].asset_name||''));
  return `
    <div class="page-head"><div><div class="eyebrow">MASTER DATA</div><h1>Master Asset</h1></div></div>
    ${canManage ? `<section class="panel"><div class="panel-head"><h2>Tambah Asset</h2></div>
      <form class="form-grid" onsubmit="saveAsset(event)">
        <label>Kode<input id="asset_code" required></label><label>Nama<input id="asset_name" required></label>
        <label>Departemen<select id="asset_dept">${Object.values(S.departments).map(d => `<option value="${d.code}">${esc(d.name)}</option>`).join('')}</select></label>
        <label>Lokasi<input id="asset_loc"></label>
        <div class="form-actions"><button class="btn btn-primary">Simpan</button></div>
      </form></section>` : ''}
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Lokasi</th></tr></thead><tbody>
      ${rows.map(([id,a]) => `<tr><td><strong>${esc(a.asset_code)}</strong></td><td>${esc(a.asset_name)}</td><td>${esc(a.location||'—')}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Belum ada asset.</td></tr>'}
    </tbody></table></div></section>`;
}
async function saveAsset(e) {
  e.preventDefault();
  await db.ref('assets/' + uid()).set({ asset_code: $('#asset_code').value, asset_name: $('#asset_name').value, department_code: $('#asset_dept').value, location: $('#asset_loc').value, is_active: true });
  flash('Asset tersimpan.'); renderApp();
}

/* ============================================================
   9. PERMINTAAN
   ============================================================ */
function pageRequests() {
  const rows = Object.entries(S.requests).sort((a,b) => (b[1].created_at||0) - (a[1].created_at||0));
  return `
    <div class="page-head"><div><div class="eyebrow">MAINTENANCE</div><h1>Permintaan Perbaikan</h1></div></div>
    <div class="grid-two">
      <section class="panel"><div class="panel-head"><h2>Buat Permintaan</h2></div>
        <form class="form-grid" onsubmit="saveRequest(event)">
          <label>Aset<select id="req_asset" required><option value="">Pilih Aset</option>${Object.entries(S.assets).map(([id,a]) => `<option value="${id}">${esc(a.asset_code)} — ${esc(a.asset_name)}</option>`).join('')}</select></label>
          <label>Prioritas<select id="req_priority"><option>NORMAL</option><option>URGENT</option></select></label>
          <label class="span-2">Deskripsi<textarea id="req_desc" required></textarea></label>
          <div class="form-actions"><button class="btn btn-primary">Kirim</button></div>
        </form>
      </section>
      <section class="panel"><div class="panel-head"><h2>Daftar Permintaan</h2></div>
        <div class="table-wrap"><table><thead><tr><th>No.</th><th>Aset</th><th>Status</th></tr></thead><tbody>
        ${rows.map(([id,r]) => `<tr><td><strong>${esc(r.request_no)}</strong></td><td>${esc((S.assets[r.asset_id]||{}).asset_name||'—')}</td><td>${badge(r.status)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Belum ada.</td></tr>'}
        </tbody></table></div>
      </section>
    </div>`;
}
async function saveRequest(e) {
  e.preventDefault();
  const id = uid(); const assetId = $('#req_asset').value;
  const data = { request_no: 'PR-'+Date.now().toString().slice(-6), requester_id: S.user.uid, requester_name: S.user.name, asset_id: assetId, priority: $('#req_priority').value, description: $('#req_desc').value, status: 'PENDING', created_at: now() };
  try {
    await db.ref('requests/' + id).set(data);
    // Logika Approval Pertama (HEAD_DEPT)
    const headDept = Object.entries(S.users).find(([u,d]) => d.role === 'HEAD_DEPT' && d.is_active);
    if (headDept) {
      await db.ref('approval_logs/' + uid()).set({ request_id: id, stage: 'HEAD_DEPARTMENT', approver_id: headDept[0], decision: 'PENDING', created_at: now() });
    }
    flash('Permintaan dibuat.'); renderApp();
  } catch (err) { flash(err.message, 'error'); }
}

/* ============================================================
   10. APPROVAL
   ============================================================ */
function pageApprovals() {
  const pending = Object.entries(S.logs).filter(([id,l]) => l.decision === 'PENDING' && (l.approver_id === S.user.uid || S.user.role === 'ADMIN'));
  if (!pending.length) return `<div class="page-head"><div><div class="eyebrow">WORKFLOW</div><h1>Approval</h1></div></div><div class="panel empty">Tidak ada approval pending.</div>`;
  
  return `<div class="page-head"><div><div class="eyebrow">WORKFLOW</div><h1>Approval Permintaan</h1></div></div>
  ${pending.map(([logId, log]) => {
    const r = S.requests[log.request_id] || {};
    return `<section class="panel">
      <div class="panel-head"><div><span class="eyebrow">${esc(stageLabel(log.stage))}</span><h2>${esc(r.request_no||'—')}</h2></div>${badge('PENDING')}</div>
      <p>${esc(r.description||'')}</p>
      <form class="form-grid" onsubmit="decideApproval(event,'${logId}')" style="margin-top:12px">
        <label class="span-2">Catatan<textarea id="dec_notes_${logId}"></textarea></label>
        <div class="form-actions">
          <button type="button" class="btn btn-danger" onclick="decideApproval(null,'${logId}','REJECTED')">Tolak</button>
          <button type="submit" class="btn btn-success">Setujui</button>
        </div>
      </form>
    </section>`;
  }).join('')}`;
}
async function decideApproval(e, logId, forcedDecision) {
  if (e) e.preventDefault();
  const decision = forcedDecision || 'APPROVED';
  const notes = (document.getElementById('dec_notes_'+logId)||{}).value || '';
  const log = S.logs[logId]; if (!log) return;
  
  await db.ref('approval_logs/' + logId).update({ decision, notes, decided_at: now(), approver_name: S.user.name });
  
  const nextStages = { HEAD_DEPARTMENT: 'ENGINEERING_SUPERVISOR', ENGINEERING_SUPERVISOR: 'ENGINEERING_MANAGER', ENGINEERING_MANAGER: 'DIRECTOR' };
  let newStatus = decision === 'REJECTED' ? 'REJECTED' : 'APPROVED';
  
  if (decision === 'APPROVED') {
    if (nextStages[log.stage]) {
      const nextApprover = Object.entries(S.users).find(([u,d]) => d.role === ({HEAD_DEPARTMENT:'HEAD_DEPT', ENGINEERING_SUPERVISOR:'ENG_SUPERVISOR', ENGINEERING_MANAGER:'ENG_MANAGER'})[log.stage] && d.is_active);
      if (nextApprover) {
        await db.ref('approval_logs/' + uid()).set({ request_id: log.request_id, stage: nextStages[log.stage], approver_id: nextApprover[0], decision: 'PENDING', created_at: now() });
        newStatus = 'PENDING';
      }
    } else {
      // Final Approval: Buat Work Order
      await db.ref('workorders/' + uid()).set({ wo_no: 'WO-'+Date.now().toString().slice(-6), request_id: log.request_id, status: 'OPEN', created_at: now() });
    }
  }
  await db.ref('requests/' + log.request_id).update({status: newStatus});
  flash('Approval disimpan.'); renderApp();
}

/* ============================================================
   11. WORK ORDER
   ============================================================ */
function pageWorkOrders() {
  const rows = Object.entries(S.workorders).sort((a,b) => (b[1].created_at||0) - (a[1].created_at||0));
  const canEdit = hasRole('ENG_SUPERVISOR','ENG_MANAGER');
  return `<div class="page-head"><div><div class="eyebrow">ENGINEERING</div><h1>Work Order (SPK)</h1></div></div>
  ${rows.map(([id, wo]) => {
    const req = S.requests[wo.request_id] || {};
    return `<section class="panel">
      <div class="panel-head"><div><h2>${esc(wo.wo_no)}</h2><p class="muted">${esc(req.request_no||'—')}</p></div>${badge(wo.status)}</div>
      <p>${esc(req.description||'')}</p>
      ${canEdit ? `<form class="form-grid" onsubmit="saveWO(event,'${id}')" style="margin-top:12px">
        <label>Status<select id="wo_status_${id}">${['OPEN','IN_PROGRESS','COMPLETED'].map(s => `<option value="${s}" ${wo.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
        <label>Diagnosa<textarea id="wo_diag_${id}">${esc(wo.diagnosis||'')}</textarea></label>
        <label>Tindakan<textarea id="wo_act_${id}">${esc(wo.action_taken||'')}</textarea></label>
        <div class="form-actions"><button class="btn btn-primary">Simpan</button></div>
      </form>` : `<div><strong>Diagnosa:</strong> ${esc(wo.diagnosis||'—')}<br><strong>Tindakan:</strong> ${esc(wo.action_taken||'—')}</div>`}
    </section>`;
  }).join('') || '<div class="panel empty">Belum ada Work Order.</div>'}`;
}
async function saveWO(e, id) {
  e.preventDefault();
  const status = $('#wo_status_'+id).value;
  await db.ref('workorders/' + id).update({ status, diagnosis: $('#wo_diag_'+id).value, action_taken: $('#wo_act_'+id).value, updated_at: now() });
  if (status === 'COMPLETED') await db.ref('requests/' + S.workorders[id].request_id).update({status:'COMPLETED'});
  flash('WO tersimpan.'); renderApp();
}

/* ============================================================
   12. STOK & PEMBELIAN
   ============================================================ */
function pageStockCard() {
  const rows = Object.entries(S.items);
  return `<div class="page-head"><div><div class="eyebrow">INVENTORY</div><h1>Kartu Stok</h1></div></div>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th class="num">Saldo</th></tr></thead><tbody>
    ${rows.map(([id,i]) => `<tr><td><strong>${esc(i.item_code)}</strong></td><td>${esc(i.item_name)}</td><td class="num">${fmtNum(totalStock(id))} ${esc(i.unit)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Kosong.</td></tr>'}
  </tbody></table></div></section>`;
}

function pagePurchases() {
  const rows = Object.entries(S.purchases);
  return `<div class="page-head"><div><div class="eyebrow">PROCUREMENT</div><h1>Pembelian Part</h1></div></div>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Qty</th><th>Status</th></tr></thead><tbody>
    ${rows.map(([id,p]) => `<tr><td>${fmtDate(p.created_at)}</td><td>${esc(p.item_name)}</td><td>${p.qty}</td><td>${badge(p.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Kosong.</td></tr>'}
  </tbody></table></div></section>`;

/* ============================================================
   13. USERS
   ============================================================ */
function pageUsers() {
  if (S.user.role !== 'ADMIN') return `<div class="panel empty">Hanya Admin.</div>`;
  const rows = Object.entries(S.users);
  return `<div class="page-head"><div><div class="eyebrow">ADMIN</div><h1>Pengguna</h1></div></div>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>
    ${rows.map(([uid,u]) => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge blue">${ROLES[u.role]||u.role}</span></td><td>${u.is_active?'Aktif':'Off'}</td></tr>`).join('')}
  </tbody></table></div></section>`;
}
