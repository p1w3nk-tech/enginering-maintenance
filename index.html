<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Maintenance — Full Flow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--border:#e5e9f0;--text:#1d2939;--muted:#667085;--navy:#13253f;--blue:#2463eb;--green:#087443;--amber:#935500;--red:#b42318;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{background:var(--navy);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{font-weight:800;font-size:16px}.brand small{display:block;font-weight:400;font-size:11px;color:#94a3b8}
.userbox{display:flex;align-items:center;gap:12px;font-size:13px}.userbox small{display:block;color:#94a3b8;font-size:11px}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:220px;background:var(--navy);color:#cbd5e1;padding:16px 0;flex-shrink:0}
.sidebar a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#cbd5e1;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
.sidebar a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar a.active{background:rgba(36,99,235,.2);color:#fff;border-left-color:var(--blue)}
.sidebar a span{width:18px;text-align:center}
.content{flex:1;padding:24px;overflow-x:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-size:22px;margin:4px 0;color:var(--navy)}h2{font-size:15px;color:var(--navy)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid-two{grid-template-columns:1fr}.sidebar{width:60px}.sidebar a{padding:12px;justify-content:center}.sidebar a span:last-child{display:none}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:0;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1d4fd8}
.btn-light{background:#eef2f7;color:var(--navy)}.btn-light:hover{background:#dde3ec}
.btn-success{background:var(--green);color:#fff}.btn-warning{background:#f5a623;color:#fff}.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #d0d5dd;border-radius:7px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:#475467;margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .span-2{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:1}}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc;font-weight:700}
tbody tr:hover{background:#f8fafc}.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.green{background:#e4f7ed;color:var(--green)}.badge.red{background:#feeceb;color:var(--red)}
.badge.amber{background:#fff2d5;color:var(--amber)}.badge.blue{background:#e8f1ff;color:#175cd3}.badge.gray{background:#f2f4f7;color:#667085}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:bold}
.alert.success{background:#e4f7ed;color:#087443;border:1px solid #a6e5c1}
.alert.error{background:#feeceb;color:#b42318;border:1px solid #f7b4b0}
.empty{padding:30px;text-align:center;color:var(--muted);font-style:italic}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:12px;align-items:center}
.metric-icon{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.metric-icon.blue{background:#e8f1ff;color:#175cd3}.metric-icon.amber{background:#fff2d5;color:#935500}
.metric-icon.red{background:#feeceb;color:#b42318}.metric-icon.purple{background:#f4ebff;color:#6941c6}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.metric-value{font-size:24px;font-weight:800;color:var(--navy)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#13253f,#2463eb)}
.login-card{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:40px;text-align:center;margin-bottom:8px}.login-card h1{text-align:center;font-size:20px;margin-bottom:4px}
.login-card p{text-align:center;color:var(--muted);font-size:12px;margin-bottom:24px}
.login-card .btn{width:100%;justify-content:center;margin-top:20px;padding:11px}
.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-bottom:10px}
@media print { 
  body { background: #fff; font-size: 12px; } 
  .topbar, .sidebar, .btn, .no-print { display: none !important; } 
  .content { padding: 0; } .layout { display: block; } 
  .panel { border: none; box-shadow: none; padding: 0; } 
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   1. KONFIGURASI FIREBASE
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBrgGfqLrEmNsOV64FWiPpBYt5tPx0ORDk",
  authDomain: "enginering-c421c.firebaseapp.com",
  databaseURL: "https://enginering-c421c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "enginering-c421c",
  storageBucket: "enginering-c421c.firebasestorage.app",
  messagingSenderId: "43147210096",
  appId: "1:43147210096:web:24fa84ef43cf9420ee33b5",
  measurementId: "G-GQ95ZBMVVV"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const FAKE_EMAIL_DOMAIN = "@app.local";

/* ============================================================
   2. STATE GLOBAL
   ============================================================ */
const S = {
  user: null, users: {}, departments: {}, items: {}, assets: {},
  requests: {}, workorders: {}, purchases: {}, logs: {}, settings: {}, stock_history: {},
  page: 'dashboard', editing: null, editingIncoming: null, filterMutasi: 'ALL',
  viewingRequest: null
};

const ROLES = {
  ADMIN: 'Admin', WAREHOUSE: 'Gudang', REQUESTER: 'Pemohon',
  HEAD_DEPT: 'Kepala Departemen', ENG_MANAGER: 'Kepala Engineering',
  DIRECTOR: 'Direktur'
};

/* ============================================================
   3. UTILITAS & RBAC
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => db.ref().push().key;
const now = () => Date.now();
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDateTime = ts => ts ? new Date(ts).toLocaleString('id-ID') : '—';

function isAdmin() { return S.user && S.user.role === 'ADMIN'; }
function isGudang() { return S.user && S.user.role === 'WAREHOUSE'; }

function badge(s) {
  const map = {APPROVED:'green',COMPLETED:'green',REJECTED:'red',PENDING:'amber',PENDING_HEAD:'amber',PENDING_MANAGER:'amber',PENDING_DIRECTOR:'amber',IN_PROGRESS:'blue',OPEN:'blue',PENDING_WAREHOUSE_APPROVAL:'amber'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s||'').replace(/_/g,' ')}</span>`;
}
function flash(msg, type='success') {
  const el = document.createElement('div'); el.className = `alert ${type}`; el.textContent = msg;
  const main = $('.content') || $('#app'); main.prepend(el);
  setTimeout(() => el.remove(), 4000);
}

function getPendingApproverName(reqId) {
  const pendingLog = Object.values(S.logs).find(l => l.request_id === reqId && l.decision === 'PENDING' && l.type !== 'WO_VARIANCE');
  if (pendingLog && S.users[pendingLog.approver_id]) {
    return S.users[pendingLog.approver_id].name;
  }
  return null;
}

/* ============================================================
   4. AUTH & INIT
   ============================================================ */
auth.onAuthStateChanged(async user => {
  if (!user) { S.user = null; renderLogin(); return; }
  const snap = await db.ref('users/' + user.uid).once('value');
  const profile = snap.val();
  if (!profile) { auth.signOut(); return; }
  if (!profile.is_active) { await auth.signOut(); alert('Akun dinonaktifkan.'); return; }
  S.user = {uid: user.uid, ...profile};
  initDataListeners();
  renderApp();
});
function renderLogin() {
  $('#app').innerHTML = `<div class="login-wrap"><div class="login-card"><div class="login-logo">⚙</div><h1>Engineering Maintenance</h1><p>Work Order · Permintaan · Stok</p><form id="loginForm"><label>Username</label><input type="text" name="username" required placeholder="cth: budi"><label>Password</label><input type="password" name="password" required><button class="btn btn-primary" type="submit">Masuk</button></form></div></div>`;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try { await auth.signInWithEmailAndPassword(e.target.username.value.toLowerCase() + FAKE_EMAIL_DOMAIN, e.target.password.value); } 
    catch (err) { alert('Login gagal: Username atau Password salah.'); }
  });
}

/* ============================================================
   5. LAYOUT & ROUTING
   ============================================================ */
function initDataListeners() {
  db.ref('departments').on('value', s => { S.departments = s.val() || {}; if (S.user) renderApp(); });
  db.ref('items').on('value', s => { S.items = s.val() || {}; if (S.user) renderApp(); });
  db.ref('assets').on('value', s => { S.assets = s.val() || {}; if (S.user) renderApp(); });
  db.ref('requests').on('value', s => { S.requests = s.val() || {}; if (S.user) renderApp(); });
  db.ref('workorders').on('value', s => { S.workorders = s.val() || {}; if (S.user) renderApp(); });
  db.ref('purchases').on('value', s => { S.purchases = s.val() || {}; if (S.user) renderApp(); });
  db.ref('approval_logs').on('value', s => { S.logs = s.val() || {}; if (S.user) renderApp(); });
  db.ref('users').on('value', s => { S.users = s.val() || {}; if (S.user) renderApp(); });
  db.ref('settings').on('value', s => { S.settings = s.val() || {}; if (S.user) renderApp(); });
  db.ref('stock_history').on('value', s => { S.stock_history = s.val() || {}; if (S.user) renderApp(); });
}

function renderApp() {
  if (!S.user) return;
  let navItems = [['dashboard','▦','Dashboard']];
  
  if (isAdmin() || isGudang()) {
    navItems.push(['items','▤','Master Barang']);
    navItems.push(['incoming','📥','Penerimaan Barang']);
    navItems.push(['mutation','📊','Report Mutasi']);
    navItems.push(['requests','✚','Permintaan']);
    navItems.push(['approvals','✓','Approval']);
    navItems.push(['workorders','⚒','Work Order']);
    if(isGudang()) navItems.push(['warehouse','📦','Gudang (Pengeluaran)']);
    navItems.push(['purchases','🛒','Pembelian']);
    if(isAdmin()) {
      navItems.push(['departments','🏢','Departemen']);
      navItems.push(['users','⚿','Pengguna']);
      navItems.push(['settings','⚙','Profil Perusahaan']);
    }
  } else {
    navItems.push(['requests','✚','Permintaan']);
    navItems.push(['approvals','✓','Approval']);
    navItems.push(['workorders','⚒','Progres & SPK']);
  }

  $('#app').innerHTML = `
    <header class="topbar no-print">
      <div class="brand">⚙ Engineering Maintenance<small>Full Flow System</small></div>
      <div class="userbox"><span>${esc(S.user.name)}<small>${esc(ROLES[S.user.role]||S.user.role)}</small></span><button class="btn btn-light btn-sm" onclick="auth.signOut()">Keluar</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar no-print">
        ${navItems.map(([k, ic, lbl]) => `<a class="${S.page===k?'active':''}" onclick="nav('${k}')"><span>${ic}</span><span>${lbl}</span></a>`).join('')}
      </aside>
      <main class="content" id="content"></main>
    </div>`;
  renderPage();
}
function nav(p) { S.page = p; S.editing = null; S.editingIncoming = null; S.viewingRequest = null; renderApp(); }

function renderPage() {
  const c = $('#content');
  const adminOnlyPages = ['departments', 'users', 'settings', 'purchases'];
  if (adminOnlyPages.includes(S.page) && !isAdmin()) {
    c.innerHTML = `<div class="panel empty" style="color:var(--red); font-weight:bold; font-size:18px;">⛔ AKSES DITOLAK. Halaman ini hanya untuk Admin.</div>`;
    return;
  }
  const gudangOnlyPages = ['items', 'incoming', 'mutation', 'warehouse'];
  if (gudangOnlyPages.includes(S.page) && !isAdmin() && !isGudang()) {
    c.innerHTML = `<div class="panel empty" style="color:var(--red); font-weight:bold; font-size:18px;">⛔ AKSES DITOLAK. Halaman ini hanya untuk Gudang/Admin.</div>`;
    return;
  }

  if (S.page === 'dashboard') c.innerHTML = pageDashboard();
  else if (S.page === 'items') c.innerHTML = pageItems();
  else if (S.page === 'incoming') c.innerHTML = pageIncoming();
  else if (S.page === 'mutation') c.innerHTML = pageMutation();
  else if (S.page === 'assets') c.innerHTML = pageAssets();
  else if (S.page === 'requests') c.innerHTML = S.viewingRequest ? pageRequestDetail(S.viewingRequest) : pageRequests();
  else if (S.page === 'approvals') c.innerHTML = pageApprovals();
  else if (S.page === 'workorders') c.innerHTML = pageWorkOrders();
  else if (S.page === 'warehouse') c.innerHTML = pageWarehouse();
  else if (S.page === 'purchases') c.innerHTML = pagePurchases();
  else if (S.page === 'departments') c.innerHTML = pageDepartments();
  else if (S.page === 'users') c.innerHTML = pageUsers();
  else if (S.page === 'settings') c.innerHTML = pageSettings();
}

/* ============================================================
   6. PROFIL & MASTER DATA
   ============================================================ */
function pageSettings() {
  const c = S.settings.company || {};
  return `<div class="page-head"><div><div class="eyebrow">PENGATURAN</div><h1>Profil Perusahaan</h1></div></div>
    <section class="panel"><form class="form-grid" onsubmit="saveCompany(event)">
      <label class="span-2">Nama Perusahaan<input id="comp_name" value="${esc(c.name||'')}" required></label>
      <label class="span-2">Alamat Lengkap<input id="comp_address" value="${esc(c.address||'')}" required></label>
      <label>Telepon<input id="comp_phone" value="${esc(c.phone||'')}"></label>
      <label>Website<input id="comp_web" value="${esc(c.web||'')}"></label>
      <div class="form-actions"><button class="btn btn-primary">Simpan Profil</button></div>
    </form></section>`;
}
async function saveCompany(e) {
  e.preventDefault();
  await db.ref('settings/company').set({ name: $('#comp_name').value, address: $('#comp_address').value, phone: $('#comp_phone').value, web: $('#comp_web').value });
  renderApp(); flash('Data profil perusahaan berhasil disimpan.');
}

function pageItems() {
  const rows = Object.entries(S.items);
  return `<div class="page-head"><div><div class="eyebrow">INVENTORY</div><h1>Master Barang</h1></div></div>
    <div class="grid-two">
      <section class="panel"><div class="panel-head"><h2>${S.editing ? 'Edit' : 'Tambah'} Barang</h2></div>
        <form class="form-grid" onsubmit="saveItem(event)">
          <input type="hidden" id="item_id" value="${S.editing||''}">
          <label>Kode<input id="item_code" required value="${esc(S.editing?S.items[S.editing].item_code:'')}"></label>
          <label>Nama Barang<input id="item_name" required value="${esc(S.editing?S.items[S.editing].item_name:'')}"></label>
          <label>Satuan<input id="item_unit" required value="${esc(S.editing?S.items[S.editing].unit:'PCS')}"></label>
          <div class="form-actions">
            ${S.editing ? '<button type="button" class="btn btn-light" onclick="nav(\'items\')">Batal</button>' : ''}
            <button class="btn btn-primary">${S.editing ? 'Update Barang' : 'Simpan Barang'}</button>
          </div>
        </form>
      </section>
      <section class="panel"><div class="panel-head"><h2>📥 Import Excel/CSV</h2></div>
        <p class="hint">Format kolom: <code>item_code, item_name, unit</code></p>
        <input type="file" accept=".csv" onchange="importItems(event)">
      </section>
    </div>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Satuan</th><th class="num">Stok</th><th>Aksi</th></tr></thead><tbody>
      ${rows.map(([id,i]) => `<tr>
        <td><strong>${esc(i.item_code)}</strong></td><td>${esc(i.item_name)}</td><td>${esc(i.unit)}</td><td class="num">${i.stock||0}</td>
        <td>
          <button class="btn btn-light btn-sm" onclick="editItem('${id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delItem('${id}')">Hapus</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="empty">Kosong.</td></tr>'}
    </tbody></table></div></section>`;
}
async function saveItem(e) {
  e.preventDefault(); const id = $('#item_id').value || uid();
  const data = { item_code: $('#item_code').value, item_name: $('#item_name').value, unit: $('#item_unit').value };
  if (!S.editing) data.stock = 0; 
  await db.ref('items/' + id).update(data); nav('items'); flash('Data Barang berhasil disimpan.');
}
function editItem(id) { S.editing = id; renderApp(); }
async function delItem(id) { if(confirm('Hapus barang ini?')) { await db.ref('items/' + id).remove(); renderApp(); flash('Barang dihapus.'); } }

function importItems(e) {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async function(results) {
      let count = 0;
      for (const row of results.data) {
        if (row.item_code && row.item_name) {
          await db.ref('items/' + uid()).set({ item_code: row.item_code, item_name: row.item_name, unit: row.unit||'PCS', stock: 0 });
          count++;
        }
      }
      renderApp(); flash(`Berhasil import ${count} data barang.`);
    }
  });
}

/* ============================================================
   7. PENERIMAAN BARANG & MUTASI STOK
   ============================================================ */
function pageIncoming() {
  const incomingHistory = Object.entries(S.stock_history)
    .filter(([id, h]) => h.qty_in > 0 && (h.description || '').indexOf('Reverse pengeluaran') === -1)
    .sort((a,b) => b[1].timestamp - a[1].timestamp);

  const isEdit = S.editingIncoming !== null;
  const editData = isEdit ? S.stock_history[S.editingIncoming] : null;
  const defaultDate = new Date().toISOString().split('T')[0];
  const editDate = editData ? new Date(editData.timestamp).toISOString().split('T')[0] : defaultDate;

  return `<div class="page-head"><div><div class="eyebrow">INVENTORY</div><h1>Penerimaan Barang (Stok Masuk)</h1></div></div>
    <section class="panel"><div class="panel-head"><h2>${isEdit ? 'Edit' : 'Input'} Barang Masuk</h2></div>
      <form class="form-grid" onsubmit="saveIncoming(event)">
        <input type="hidden" id="in_history_id" value="${S.editingIncoming||''}">
        <label>Tanggal Masuk<input type="date" id="in_date" required value="${editDate}"></label>
        <label>Pilih Barang<select id="in_item" required ${isEdit ? 'disabled' : ''}>
          <option value="">— Pilih Barang —</option>
          ${Object.entries(S.items).map(([id,i]) => `<option value="${id}" ${isEdit && editData.item_id === id ? 'selected' : ''}>${esc(i.item_code)} — ${esc(i.item_name)} (Stok: ${i.stock||0})</option>`).join('')}
        </select></label>
        <label>Qty Masuk<input type="number" id="in_qty" min="1" required value="${isEdit ? editData.qty_in : ''}"></label>
        <label>No. PO / Surat Jalan<input id="in_ref" placeholder="Cth: PO-2023-001" required value="${isEdit ? esc(editData.ref_no) : ''}"></label>
        <label class="span-2">Keterangan Tambahan<input id="in_notes" placeholder="Cth: Pembelian dari Supplier A" value="${isEdit ? esc(editData.description) : ''}"></label>
        <div class="form-actions">
          ${isEdit ? '<button type="button" class="btn btn-light" onclick="S.editingIncoming=null; renderApp()">Batal</button>' : ''}
          <button class="btn btn-primary">${isEdit ? 'Update Penerimaan' : 'Simpan Penerimaan'}</button>
        </div>
      </form>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Riwayat Penerimaan Barang</h2></div>

function editIncoming(hid) { S.editingIncoming = hid; renderApp(); window.scrollTo(0, 0); }
async function saveIncoming(e) {
  e.preventDefault();
  const hid = $('#in_history_id').value;
  const dateStr = $('#in_date').value;
  const itemId = $('#in_item').value;
  const qty = parseFloat($('#in_qty').value);
  const ref = $('#in_ref').value;
  const notes = $('#in_notes').value;
  
  if(!itemId || qty <= 0) return alert('Data tidak valid.');
  const ts = new Date(dateStr).getTime();
  const item = S.items[itemId];

  if (hid) {
    const oldH = S.stock_history[hid];
    const diff = qty - oldH.qty_in;
    const newStock = (item.stock || 0) + diff;
    if (newStock < 0) return alert('Gagal update: Stok akan minus.');
    await db.ref('items/' + itemId).update({ stock: newStock });
    await db.ref('stock_history/' + hid).update({ qty_in: qty, balance_after: newStock, ref_no: ref, description: notes || 'Penerimaan Barang', timestamp: ts });
    flash('Penerimaan barang berhasil diperbarui.');
    S.editingIncoming = null;
  } else {
    const newStock = (item.stock || 0) + qty;
    await db.ref('items/' + itemId).update({ stock: newStock });
    await db.ref('stock_history/' + uid()).set({
      item_id: itemId, item_name: item.item_name, qty_in: qty, qty_out: 0,
      balance_after: newStock, ref_no: ref, description: notes || 'Penerimaan Barang', timestamp: ts, user: S.user.name
    });
    flash('Stok berhasil ditambahkan.');
  }
  renderApp();
}
async function reverseIncoming(historyId, itemId, qty) {
  if(!confirm(`Batalkan penerimaan stok sebanyak ${qty}?`)) return;
  const item = S.items[itemId];
  if(item.stock < qty) return alert('Gagal reverse: Stok saat ini lebih kecil.');
  const newStock = item.stock - qty;
  await db.ref('items/' + itemId).update({ stock: newStock });
  await db.ref('stock_history/' + historyId).remove();
  flash('Penerimaan berhasil dibatalkan.'); renderApp();
}

async function createNewUser(e) {
  e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true;
  const uname = $('#new_username').value.toLowerCase();
  const pw = $('#new_password').value;
  
  try {
    const secApp = firebase.initializeApp(firebaseConfig, "Sec");
    const cred = await secApp.auth().createUserWithEmailAndPassword(uname + FAKE_EMAIL_DOMAIN, pw);
    
    await db.ref('users/' + cred.user.uid).set({ 
      name: $('#new_name').value, 
      username: uname, 
      plain_password: pw, 
      role: $('#new_role').value, 
      department_id: $('#new_dept').value || null, 
      is_active: true 
    });
    
    await secApp.auth().signOut(); await secApp.delete();
    flash('Akun pengguna berhasil dibuat.'); e.target.reset();
  } catch (err) { 
    if(err.code === 'auth/email-already-in-use') {
      flash('Username sudah dipakai, gunakan username lain.', 'error');
    } else {
      flash(err.message, 'error'); 
    }
  }
  btn.disabled = false;
}

async function resetUserPassword(uid) {
  const u = S.users[uid];
  if (!u.plain_password) {
    alert("Tidak bisa reset password karena password lama tidak tersimpan di database (kemungkinan user dibuat sebelum fitur ini ada). Silakan hapus dan buat ulang user.");
    return;
  }
  
  const newPw = prompt(`Masukkan password BARU untuk ${u.username} (minimal 6 karakter):`);
  if (!newPw || newPw.length < 6) {
    if (newPw !== null) alert("Password minimal 6 karakter.");
    return;
  }

  try {
    // Gunakan secondary app untuk login sebagai user tersebut
    const resetAppName = "ResetApp_" + Date.now();
    const resetApp = firebase.initializeApp(firebaseConfig, resetAppName);
    const resetAuth = resetApp.auth();

    // Login menggunakan password lama
    const email = u.username + FAKE_EMAIL_DOMAIN;
    const cred = await resetAuth.signInWithEmailAndPassword(email, u.plain_password);

    // Update ke password baru
    await cred.user.updatePassword(newPw);

    // Logout dan hapus app
    await resetAuth.signOut();
    await resetApp.delete();

    // Update DB
    await db.ref('users/' + uid).update({ plain_password: newPw });
    
    flash(`Password untuk ${u.username} berhasil direset menjadi: ${newPw}`);
    renderApp();

  } catch (err) {
    console.error(err);
    if (err.code === 'auth/wrong-password') {
      alert("Gagal reset: Password lama di database tidak cocok dengan Firebase Auth. (Mungkin password pernah diubah lewat konsol Firebase).");
    } else {
      alert("Gagal reset password: " + err.message);
    }
  }
}

async function deleteUser(uid) {
  if (uid === S.user.uid) return alert('Anda tidak bisa menghapus akun Anda sendiri.');
  if (!confirm('Hapus pengguna ini? Pengguna tidak akan bisa login lagi.')) return;
  await db.ref('users/' + uid).remove(); renderApp(); flash('Pengguna berhasil dihapus (Akses dicabut).');
}

  Object.entries(S.logs).forEach(([logId, log]) => { if(log.request_id === reqId) db.ref('approval_logs/' + logId).remove(); });
  Object.entries(S.workorders).forEach(([woId, wo]) => { if(wo.request_id === reqId) db.ref('workorders/' + woId).remove(); });
  flash('Permintaan beserta data terkait berhasil dihapus.');
  renderApp();
}

async function saveRequest(e) {
  e.preventDefault();
  const reqId = uid();
  const deptId = $('#req_dept').value;

  await db.ref('requests/' + reqId).set({ 
    request_no: 'PR-'+Date.now().toString().slice(-6), 
    dept_id: deptId, 
    asset: $('#req_asset').value,
    description: $('#req_desc').value, 
    requester_name: S.user.name, 
    status: 'PENDING_HEAD', 
    created_at: now() 
  });

  const headDeptUid = Object.keys(S.users).find(uid => 
    S.users[uid].role === 'HEAD_DEPT' && S.users[uid].department_id === deptId
  );

  if (headDeptUid) {
    await db.ref('approval_logs/' + uid()).set({ request_id: reqId, stage: 'HEAD_DEPT', approver_id: headDeptUid, decision: 'PENDING', created_at: now() });
    flash('Permintaan dikirim ke Kepala Departemen.');
  } else {
    const engMgrUid = Object.keys(S.users).find(uid => S.users[uid].role === 'ENG_MANAGER');
    if(engMgrUid) {
      await db.ref('requests/' + reqId).update({status: 'PENDING_MANAGER'});
      await db.ref('approval_logs/' + uid()).set({ request_id: reqId, stage: 'ENG_MANAGER', approver_id: engMgrUid, decision: 'PENDING', created_at: now() });
      flash('Diteruskan ke Kepala Engineering.', 'warning');
    }
  }
  renderApp();
}

async function processWarehouse(e, woId) {
  e.preventDefault();
  const wo = S.workorders[woId];
  const pickupDateTs = new Date($('#pickup_date_'+woId).value).getTime();
  const notes = $('#pickup_notes_'+woId).value;

  const section = $('#pickup_date_' + woId).closest('section');
  const qtyInputs = section.querySelectorAll('.actual-qty');
  
  let issuedItems = [];
  let isMatch = true;

  qtyInputs.forEach(input => {
    const itemId = input.getAttribute('data-item-id');
    const reqQty = parseFloat(input.getAttribute('data-req-qty'));
    const actQty = parseFloat(input.value) || 0;

    if (reqQty !== actQty) isMatch = false;
    if (actQty > 0) issuedItems.push({ item_id: itemId, qty: actQty });
  });

  if (isMatch) {
    let err = false;
    for (const it of issuedItems) {
      const item = S.items[it.item_id];
      if (item.stock < it.qty) { alert(`Stok ${item.item_name} tidak cukup!`); err = true; break; }
    }
    if (err) return;

    if(!confirm('Qty sesuai dengan Work Order. Posting pengeluaran barang sekarang?')) return;

    for (const it of issuedItems) {
      const item = S.items[it.item_id];
      const newStock = item.stock - it.qty;
      const req = S.requests[wo.request_id];

      await db.ref('items/' + it.item_id).update({ stock: newStock });
      await db.ref('stock_history/' + uid()).set({
        item_id: it.item_id, item_name: item.item_name, qty_in: 0, qty_out: it.qty,
        balance_after: newStock, ref_no: wo.wo_no, description: `Perbaikan: ${req.asset}`, timestamp: pickupDateTs, user: S.user.name
      });
    }

    await db.ref('workorders/' + woId).update({
      status: 'IN_PROGRESS',
      pickup_date: pickupDateTs,
      issued_items: issuedItems,
      items: [] // Kosongkan karena sudah diambil
    });
    flash('Barang berhasil dikeluarkan. Stok terpotong.');

  } else {
    if(!confirm('Qty berbeda dengan Work Order. Ajukan Revisi ke Kepala Engineering dan Direktur?')) return;

    await db.ref('workorders/' + woId).update({
      status: 'PENDING_WAREHOUSE_APPROVAL',
      pickup_date: pickupDateTs,
      issued_items: issuedItems,
      variance_notes: notes
    });

    const engMgrUid = Object.keys(S.users).find(uid => S.users[uid].role === 'ENG_MANAGER');
    if(engMgrUid) {
      await db.ref('approval_logs/' + uid()).set({ 
        request_id: wo.request_id, wo_id: woId, type: 'WO_VARIANCE', 
        stage: 'ENG_MANAGER', approver_id: engMgrUid, decision: 'PENDING', created_at: now() 
      });
      flash('Qty berbeda. Pengajuan revisi dikirim ke Kepala Engineering.');
    } else {
      flash('Gagal: Belum ada Kepala Engineering untuk approve revisi.', 'error');
    }
  }
  renderApp();
}

async function decideVariance(logId, dec) {
  const log = S.logs[logId];
  const wo = S.workorders[log.wo_id];
  const req = S.requests[log.request_id];
  
  await db.ref('approval_logs/' + logId).update({ decision: dec, decided_at: now() });
  
  if (dec === 'REJECTED') {
    await db.ref('workorders/' + log.wo_id).update({ 
      status: 'OPEN', 
      issued_items: null, 
      variance_notes: null
    });
    return flash('Revisi ditolak. Gudang harus mengulang penyiapan barang.', 'error');
  }

  if (log.stage === 'ENG_MANAGER') {
    const nextUid = Object.keys(S.users).find(uid => S.users[uid].role === 'DIRECTOR');
    if(nextUid) {
      await db.ref('approval_logs/' + uid()).set({ 
        request_id: log.request_id, wo_id: log.wo_id, type: 'WO_VARIANCE', 
        stage: 'DIRECTOR', approver_id: nextUid, decision: 'PENDING', created_at: now() 
      });
      flash('Disetujui Kepala Engineering. Diteruskan ke Direktur.');
    } else {
      flash('Gagal: Belum ada user Direktur.', 'error');
    }
  } 
  else if (log.stage === 'DIRECTOR') {
    const issuedItems = wo.issued_items || [];
    for (const it of issuedItems) {
      const item = S.items[it.item_id];
      const newStock = item.stock - it.qty;
      
      await db.ref('items/' + it.item_id).update({ stock: newStock });
      await db.ref('stock_history/' + uid()).set({
        item_id: it.item_id, item_name: item.item_name, qty_in: 0, qty_out: it.qty,
        balance_after: newStock, ref_no: wo.wo_no, description: `Perbaikan (Revisi): ${req.asset}`, timestamp: wo.pickup_date || now(), user: S.user.name
      });
    }

    await db.ref('workorders/' + log.wo_id).update({ 
      status: 'IN_PROGRESS',
      items: [] 
    });
    flash('Revisi disetujui Direktur. Stok dipotong & barang siap diambil.');
  }
  renderApp();
}

async function decideApproval(logId, dec) {
  const log = S.logs[logId];
  const req = S.requests[log.request_id];
  await db.ref('approval_logs/' + logId).update({ decision: dec, decided_at: now() });
  
  if (dec === 'REJECTED') {
    await db.ref('requests/' + log.request_id).update({status: 'REJECTED'});
    return flash('Permintaan ditolak.');
  }

  const updateData = {};
  if (log.stage === 'HEAD_DEPT') {
    updateData.approver_head_name = S.user.name;
    updateData.approver_head_date = now();
    updateData.status = 'PENDING_MANAGER';
    const nextUid = Object.keys(S.users).find(uid => S.users[uid].role === 'ENG_MANAGER');
    if(nextUid) await db.ref('approval_logs/' + uid()).set({ request_id: log.request_id, stage: 'ENG_MANAGER', approver_id: nextUid, decision: 'PENDING', created_at: now() });
  } 
  else if (log.stage === 'ENG_MANAGER') {
    updateData.approver_eng_name = S.user.name;
    updateData.approver_eng_date = now();
    updateData.status = 'PENDING_DIRECTOR';
    const nextUid = Object.keys(S.users).find(uid => S.users[uid].role === 'DIRECTOR');
    if(nextUid) await db.ref('approval_logs/' + uid()).set({ request_id: log.request_id, stage: 'DIRECTOR', approver_id: nextUid, decision: 'PENDING', created_at: now() });
  } 
  else if (log.stage === 'DIRECTOR') {
    updateData.approver_dir_name = S.user.name;
    updateData.approver_dir_date = now();
    updateData.status = 'APPROVED';
    const existingWO = Object.values(S.workorders).find(w => w.request_id === log.request_id);
    if(!existingWO) {
      await db.ref('workorders/' + uid()).set({ wo_no: 'WO-'+Date.now().toString().slice(-6), request_id: log.request_id, items: [], status: 'OPEN', created_at: now() });
    }
  }
  await db.ref('requests/' + log.request_id).update(updateData);
  flash('Keputusan disimpan.'); renderApp();
}

async function reverseWOTransaction(historyId, itemId, qty, woId) {
  if(!confirm(`Batalkan pengeluaran barang sebanyak ${qty}? Stok akan dikembalikan dan WO kembali ke antrean.`)) return;
  const historyItem = S.stock_history[historyId];
  const item = S.items[itemId];
  if(!historyItem || !item) return alert('Data tidak ditemukan.');

  const newStock = item.stock + qty;

  await db.ref('items/' + itemId).update({ stock: newStock });

  await db.ref('stock_history/' + uid()).set({
    item_id: itemId, item_name: item.item_name, qty_in: qty, qty_out: 0,
    balance_after: newStock, ref_no: 'REV-'+historyItem.ref_no, description: `Reverse pengeluaran: ${historyItem.ref_no}`, timestamp: now(), user: S.user.name
  });

  await db.ref('stock_history/' + historyId).remove();

  const wo = S.workorders[woId];
  const items = wo.items || [];
  const existing = items.find(it => it.item_id === itemId);
  if(existing) {
    existing.qty += qty;
  } else {
    items.push({ item_id: itemId, qty: qty });
  }

  await db.ref('workorders/' + woId).update({ 
    items: items,
    status: 'OPEN',
    issued_items: null,
    pickup_date: null
  });
  
  flash('Transaksi berhasil direverse. Stok dikembalikan & WO kembali ke OPEN.');
  renderApp();
}

function resolveItemId(inputEl, woId) {
  const val = inputEl.value;
  const datalist = document.getElementById('items-datalist-' + woId);
  const options = datalist.getElementsByTagName('option');
  let foundId = '';
  for (let i = 0; i < options.length; i++) {
    if (options[i].value === val) {
      foundId = options[i].getAttribute('data-id');
      break;
    }
  }
  document.getElementById('add_item_' + woId).value = foundId;
}

function printSPK(id) {
  const content = document.getElementById('print-spk-' + id).innerHTML;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Cetak SPK</title><style>body{font-family:Arial,sans-serif;font-size:14px;padding:20px;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #000;padding:8px;}</style></head><body>${content}<script>window.onload=()=>window.print()<\/script></body></html>`);
  win.document.close();
}

async function addItemToWO(e, woId) {
  e.preventDefault();
  const itemId = $('#add_item_'+woId).value;
  const qty = parseFloat($('#add_qty_'+woId).value);
  
  if(!itemId) return alert('Pilih barang dari daftar yang muncul.');
  if(qty <= 0) return;

  const wo = S.workorders[woId];
  const items = wo.items || [];
  const existing = items.find(it => it.item_id === itemId);
  
  if(existing) {
    existing.qty += qty;
  } else {
    items.push({ item_id: itemId, qty: qty });
  }

  await db.ref('workorders/' + woId).update({ items });
  flash('Barang ditambahkan ke Work Order.');
  renderApp();
}

async function saveWO(e, id) {
  e.preventDefault(); const status = $('#wo_status_'+id).value;
  await db.ref('workorders/' + id).update({ status, diagnosis: $('#wo_diag_'+id).value, action_taken: $('#wo_act_'+id).value, test_result: $('#wo_test_'+id).value, updated_at: now() });
  flash('Progres Work Order diperbarui.'); renderApp();
}

async function requestPurchase(woId, itemId, qty) {
  const item = S.items[itemId];
  await db.ref('purchases/' + uid()).set({ wo_id: woId, item_name: item ? item.item_name : 'Unknown', qty: qty, status: 'PENDING', requester_name: S.user.name, created_at: now() });
  flash('Pengajuan pembelian dikirim.'); renderApp();
}

function pagePurchases() {
  const rows = Object.entries(S.purchases);
  return `<div class="page-head"><div><div class="eyebrow">PROCUREMENT</div><h1>Permintaan Pembelian</h1></div></div>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nama Barang</th><th>Qty</th><th>Status</th></tr></thead><tbody>
    ${rows.map(([id,p]) => `<tr><td>${fmtDate(p.created_at)}</td><td>${esc(p.item_name)}</td><td>${p.qty}</td><td>${badge(p.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Belum ada pembelian.</td></tr>'}
  </tbody></table></div></section>`;
}

function pageDashboard() {
  return `<div class="page-head"><div><h1>Dashboard</h1></div></div>
  <div class="metrics">
    <div class="metric"><div class="metric-icon blue">▤</div><div><div class="metric-label">Total Permintaan</div><div class="metric-value">${Object.keys(S.requests).length}</div></div></div>
    <div class="metric"><div class="metric-icon purple">⚒</div><div><div class="metric-label">Work Order</div><div class="metric-value">${Object.keys(S.workorders).length}</div></div></div>
  </div>`;
}
